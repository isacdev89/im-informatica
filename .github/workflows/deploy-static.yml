# Publica automaticamente a pasta "static/" no GitHub Pages sempre que
# houver um push na branch "main". Depois de habilitar o GitHub Pages
# com a opcao "GitHub Actions" (Settings -> Pages -> Source), este
# workflow roda sozinho, sem nenhum passo manual adicional.
name: Publicar site no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar a pasta static/
        uses: actions/upload-pages-artifact@v3
        with:
          path: "static"

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
