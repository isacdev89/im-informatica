{% extends "base.html" %}
{% block title %}Área do Cliente — {{ settings.empresa_nome }}{% endblock %}
{% block robots %}noindex, nofollow{% endblock %}
{% block content %}
<main class="container" style="padding-top:140px; padding-bottom:100px;">
  <div style="max-width:460px; margin:0 auto;">
    <div class="section-head text-center reveal in" style="margin:0 auto 30px;">
      <span class="eyebrow">ÁREA DO CLIENTE</span>
      <h2>Acesse sua conta</h2>
      <p>Consulte histórico de serviços, orçamentos e downloads.</p>
    </div>

    <div class="tab-row" style="display:flex; gap:8px; margin-bottom:26px;">
      <button class="filter-btn active" id="tabLogin" style="flex:1;">Login</button>
      <button class="filter-btn" id="tabCadastro" style="flex:1;">Cadastro</button>
    </div>

    <form method="POST" action="{{ url_for('cliente_login') }}" class="glass" id="loginForm" style="padding:28px; border-radius:var(--radius-lg);">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-field"><label>E-mail</label><input type="email" name="email" required placeholder="voce@email.com"></div>
      <div class="form-field"><label>Senha</label><input type="password" name="password" required placeholder="••••••••"></div>
      <button class="btn btn-primary btn-block" type="submit">Entrar</button>
    </form>

    <form method="POST" action="{{ url_for('cliente_cadastro') }}" class="glass" id="cadastroForm" style="padding:28px; border-radius:var(--radius-lg); display:none;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-field"><label>Nome completo</label><input type="text" name="name" required placeholder="Seu nome"></div>
      <div class="form-field"><label>E-mail</label><input type="email" name="email" required placeholder="voce@email.com"></div>
      <div class="form-field"><label>Telefone</label><input type="tel" name="phone" placeholder="(92) 99423-5355"></div>
      <div class="form-field"><label>Senha</label><input type="password" name="password" required placeholder="Crie uma senha"></div>
      <button class="btn btn-primary btn-block" type="submit">Criar conta</button>
    </form>
  </div>
</main>
<script>
  document.getElementById('tabLogin').addEventListener('click', ()=>{
    document.getElementById('tabLogin').classList.add('active');
    document.getElementById('tabCadastro').classList.remove('active');
    document.getElementById('loginForm').style.display='block';
    document.getElementById('cadastroForm').style.display='none';
  });
  document.getElementById('tabCadastro').addEventListener('click', ()=>{
    document.getElementById('tabCadastro').classList.add('active');
    document.getElementById('tabLogin').classList.remove('active');
    document.getElementById('cadastroForm').style.display='block';
    document.getElementById('loginForm').style.display='none';
  });
</script>
{% endblock %}
