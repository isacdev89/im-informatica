<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Administrativo — {{ settings.empresa_nome }}</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body data-theme="dark" style="min-height:100vh; display:flex; align-items:center;">
<div class="container" style="max-width:420px;">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="glass" style="padding:14px 18px; border-radius:12px; margin-bottom:16px; border:1px solid {{ '#FF5C7A' if category=='error' else 'var(--ok)' }}; color:{{ '#FF5C7A' if category=='error' else 'var(--ok)' }};">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  <div class="section-head text-center" style="margin:0 auto 26px;">
    <span class="eyebrow">ACESSO RESTRITO</span>
    <h2>Painel Administrativo</h2>
  </div>
  <form method="POST" class="glass" style="padding:28px; border-radius:var(--radius-lg);">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-field"><label>Usuário</label><input type="text" name="username" required placeholder="admin" autofocus></div>
    <div class="form-field"><label>Senha</label><input type="password" name="password" required placeholder="••••••••"></div>
    <button class="btn btn-primary btn-block" type="submit">Entrar</button>
  </form>
  <p style="text-align:center; margin-top:16px; font-size:.8rem; color:var(--text-muted);">
    <a href="{{ url_for('index') }}" style="color:var(--neon);">← Voltar ao site</a>
  </p>
</div>
</body>
</html>
