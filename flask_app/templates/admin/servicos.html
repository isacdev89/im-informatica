{% extends "admin/base.html" %}
{% block title %}Serviços{% endblock %}
{% block admin_content %}
<div class="panel-head"><h3>Serviços</h3></div>
<form method="POST" class="glass" style="padding:22px; border-radius:var(--radius-md); margin-bottom:26px;">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="row g-3">
    <div class="col-md-3"><div class="form-field"><label>Ícone (Font Awesome)</label><input type="text" name="icon" placeholder="fa-screwdriver-wrench"></div></div>
    <div class="col-md-4"><div class="form-field"><label>Título</label><input type="text" name="title" required></div></div>
    <div class="col-md-5"><div class="form-field"><label>Descrição</label><input type="text" name="description"></div></div>
  </div>
  <button class="btn btn-primary btn-sm" type="submit"><i class="fa-solid fa-plus"></i> Cadastrar serviço</button>
</form>
<div class="table-wrap glass"><table>
  <thead><tr><th>Ícone</th><th>Título</th><th>Descrição</th><th>Ações</th></tr></thead>
  <tbody>
    {% for s in items %}
    <tr>
      <td><i class="fa-solid {{ s.icon }}"></i></td><td>{{ s.title }}</td><td>{{ s.description }}</td>
      <td class="row-actions">
        <form method="POST" action="{{ url_for('admin_servicos_excluir', item_id=s.id) }}" style="display:inline;" onsubmit="return confirm('Excluir este serviço?');">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit"><i class="fa-solid fa-trash"></i></button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="4" style="color:var(--text-muted);">Nenhum serviço cadastrado.</td></tr>
    {% endfor %}
  </tbody>
</table></div>
{% endblock %}
